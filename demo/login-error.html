<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ورود — دمو</title>
    <style>
      body {
        margin: 0;
        padding: 32px 16px;
        background: #0b1120;
        color: #e5e7eb;
        font-family: Vazirmatn, system-ui, Tahoma, sans-serif;
        direction: rtl;
      }
      form {
        max-width: 360px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        gap: 12px;
        background: #111c33;
        border: 1px solid #1f2b45;
        border-radius: 12px;
        padding: 20px;
      }
      h1 {
        font-size: 16px;
        margin: 0 0 6px;
      }
      label {
        font-size: 12px;
        color: #94a3b8;
      }
      input {
        background: #0f172a;
        border: 1px solid #1f2b45;
        border-radius: 8px;
        color: #e5e7eb;
        padding: 10px;
        font: inherit;
        direction: ltr;
        text-align: left;
      }
      button[type="submit"] {
        background: #1d4ed8;
        border: 0;
        border-radius: 8px;
        color: #fff;
        padding: 10px;
        font: inherit;
        cursor: pointer;
      }
      #error {
        margin: 0;
        color: #fca5a5;
        font-size: 12px;
        line-height: 1.9;
        min-height: 18px;
      }
    </style>
  </head>
  <body>
    <form id="login" action="#">
      <h1>ورود به حساب (صفحهٔ آزمایشی)</h1>
      <label for="user">نام کاربری</label>
      <input id="user" name="username" type="email" autocomplete="username" />
      <label for="pass">گذرواژه</label>
      <input id="pass" name="password" type="password" autocomplete="current-password" />
      <p id="error"></p>
      <button type="submit">ورود</button>
    </form>
    <script>
      // A failed sign-in that stays on the page: the form is still there and the site says why.
      // Nothing may be offered for saving here — offering the password the server just rejected
      // is the one mistake that makes a save prompt untrustworthy.
      document.getElementById("login").addEventListener("submit", function (event) {
        event.preventDefault();
        document.getElementById("error").textContent = "نام کاربری یا رمز عبور اشتباه است.";
        window.__failed = true;
      });
    </script>
  </body>
</html>
